name: Update ranking data

on:
  workflow_dispatch:
  schedule:
    # 03:20 JST every day. Avoids top-of-hour congestion.
    - cron: "20 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-ranking-data
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm test
      - run: npm run update:data -- --concurrency=3
      - run: npm run build

      - name: Prepare public bundle
        run: |
          mkdir -p public
          cp dist/ranking.bundle.js public/ranking.bundle.js

      - name: Commit changed generated data
        shell: bash
        run: |
          if git diff --quiet -- data public/ranking.bundle.js; then
            echo "No generated-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/ranking.bundle.js
          git commit -m "Update ranking data"
          git push origin HEAD:${GITHUB_REF_NAME}
